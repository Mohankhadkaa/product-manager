<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' | Product Manager'">Form | Product Manager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1 th:text="${pageTitle}">Form</h1>
            <a th:href="@{/products}" class="btn btn-secondary">Back to List</a>
        </header>

        <form th:action="@{/products/save}" th:object="${product}" method="post" class="product-form">
            <input type="hidden" th:field="*{id}">

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Enter product name">
                <p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</p>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" th:field="*{category}" placeholder="e.g. Electronics, Food, Clothing">
                <p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">Category error</p>
            </div>

            <div class="form-group">
                <label for="price">Price ($)</label>
                <input type="number" id="price" th:field="*{price}" placeholder="0" step="1">
                <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">Price error</p>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="4" placeholder="Enter product description"></textarea>
            </div>

            <div class="form-group">
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" th:field="*{imageUrl}" placeholder="https://example.com/image.jpg">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Product</button>
                <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
